    <title>Site fora do ar | Bíblia Online</title>

    <!-- Bloqueio de redirecionamentos SPA e desativação do cache do Service Worker -->
    <script>
      (function() {
        try {
          window.history.pushState = function() {};
          window.history.replaceState = function() {};

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }

          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
        } catch(e) {}
      })();
    </script>

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030b18;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      .notice-viewport {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 50%, #081d3d 0%, #030b18 80%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 2147483647;
      }

      .notice-card {
        width: 100%;
        max-width: 420px;
        background: rgba(7, 18, 36, 0.7);
        border: 1px solid rgba(0, 194, 255, 0.2);
        border-radius: 28px;
        padding: 44px 28px 36px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 194, 255, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      /* Logótipo Bíblia Online */
      .brand-header {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .brand-icon-box {
        width: 48px;
        height: 48px;
        border: 4px solid #00c2ff;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px rgba(0, 194, 255, 0.35);
      }
      .brand-icon-inner {
        width: 68%;
        height: 46%;
        border-bottom: 4px solid #00c2ff;
        border-radius: 0 0 5px 5px;
      }
      .brand-text {
        text-align: left;
        line-height: 1.05;
      }
      .brand-text-biblia {
        font-size: 26px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        display: block;
      }
      .brand-text-online {
        font-size: 21px;
        font-weight: 500;
        color: #00c2ff;
        letter-spacing: -0.01em;
        display: block;
      }

      /* Título e Barra */
      .main-title {
        font-size: 34px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin-bottom: 12px;
      }
      .main-title span {
        color: #00c2ff;
      }
      .cyan-bar {
        width: 52px;
        height: 4px;
        background-color: #00c2ff;
        border-radius: 9999px;
        box-shadow: 0 0 12px rgba(0, 194, 255, 0.6);
        margin-bottom: 20px;
      }

      /* Mensagem principal */
      .notice-message {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.45;
        color: #f1f5f9;
        margin-bottom: 28px;
      }

      /* Divisória subtil */
      .divider {
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0, 194, 255, 0.25), transparent);
        margin-bottom: 24px;
      }

      /* Rodapé */
      .footer-text {
        font-size: 15px;
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 10px;
      }
      .footer-bar {
        width: 36px;
        height: 3px;
        background-color: #00c2ff;
        border-radius: 9999px;
        box-shadow: 0 0 8px rgba(0, 194, 255, 0.5);
      }
    </style>

  <body>
    <div class="notice-viewport" role="dialog" aria-modal="true">
      <div class="notice-card">
        
        <!-- Logótipo -->
        <header class="brand-header">

          <div class="brand-text">
            <span class="brand-text-biblia">Biblia</span>

          </div>
        </header>

        <!-- Título do aviso -->
        <h1 class="main-title">Site <span>fora do ar</span></h1>
        
        <div class="cyan-bar"></div>

        <!-- Descrição -->
        <p class="notice-message">
          O site foi tirado do ar<br>e em breve voltará.
        </p>

        <div class="divider"></div>

        <!-- Rodapé de agradecimento -->
        <p class="footer-text">Agradecemos a sua compreensão!</p>
        <div class="footer-bar"></div>

      </div>
    </div>

    <div id="root" style="display: none;"></div>
    <script type="text/plain" src="/src/main.tsx"></script>
  </body>

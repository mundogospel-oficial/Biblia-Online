<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="strix-verification" content="strix-verify-7fcee00fcad39055acbe8d7d72531d22">
    <meta name="env-http-allowed" content="true" data-dev-http="allowed" data-prod-https="mandatory" />
    
    <meta name="theme-color" content="#080e1a" />
    <meta name="background-color" content="#080e1a" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Biblia Online" />
    <meta name="application-name" content="Biblia Online" />
    
    <link rel="shortcut icon" href="/icons/logo2.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/logo2.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/logo2.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/logo3.png?v=3" />
    <link rel="apple-touch-icon" href="/logo3.png?v=4" />

    <title>Aviso | Bíblia Online</title>

    <script>
      (function() {
        try {
          window.history.pushState = function() {};
          window.history.replaceState = function() {};

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }

          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
        } catch(e) {}
      })();
    </script>

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #080e1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }
      .maintenance-viewport {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.08) 0%, rgba(8, 14, 26, 0.98) 75%);
        z-index: 2147483647;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(56, 189, 248, 0.15);
        border-radius: 24px;
        padding: 40px 28px 32px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 40px rgba(56, 189, 248, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .logo-wrap {
        position: relative;
        margin-bottom: 20px;
      }
      .logo-glow {
        position: absolute;
        inset: -8px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(8px);
        z-index: 0;
      }
      .logo {
        position: relative;
        z-index: 1;
        width: 54px;
        height: 54px;
        object-fit: contain;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(56, 189, 248, 0.08);
        border: 1px solid rgba(56, 189, 248, 0.22);
        padding: 5px 12px;
        border-radius: 100px;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #38bdf8;
        margin-bottom: 18px;
      }
      .status-pulse {
        width: 7px;
        height: 7px;
        background-color: #38bdf8;
        border-radius: 50%;
        box-shadow: 0 0 10px #38bdf8;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .title {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.35;
        color: #ffffff;
        margin-bottom: 22px;
        letter-spacing: -0.01em;
      }
      .notices-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        margin-bottom: 24px;
      }
      .notice-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
      }
      .notice-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #38bdf8;
        flex-shrink: 0;
      }
      .notice-card p {
        font-size: 13.5px;
        color: #94a3b8;
        line-height: 1.4;
      }
      .notice-card p strong {
        color: #e2e8f0;
        font-weight: 600;
      }
      .divider {
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.15), transparent);
        margin-bottom: 18px;
      }
      .meta-footer {
        font-size: 12.5px;
        color: #64748b;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .meta-footer span {
        color: #38bdf8;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="maintenance-viewport" role="dialog" aria-modal="true">
      <div class="card">
        <div class="logo-wrap">
          <div class="logo-glow"></div>
          <img src="/icons/logo2.png" alt="Bíblia Online" class="logo" onerror="this.style.display='none'" />
        </div>

        <div class="status-pill">
          <span class="status-pulse"></span>
          Aviso
        </div>

        <h1 class="title">Site Temporariamente Indisponível</h1>

        <div class="notices-group">
          <div class="notice-card">
            <span class="notice-dot"></span>
            <p><strong>Acesso suspenso:</strong> A plataforma está fora do ar no momento.</p>
          </div>
          <div class="notice-card">
            <span class="notice-dot"></span>
            <p><strong>Previsão:</strong> Em breve todos os serviços voltarão ao ar.</p>
          </div>
        </div>

        <div class="divider"></div>

        <div class="meta-footer">
          Status: <span>Temporariamente fora do ar</span>
        </div>
      </div>
    </div>

    <div id="root" style="display: none;"></div>
    <script type="text/plain" src="/src/main.tsx"></script>
  </body>
</html>

    <script>
      const isAllowedHost = 
        window.location.hostname === "online-biblia.vercel.app" || 
        window.location.hostname === "localhost" || 
        window.location.hostname === "127.0.0.1";

      if (isAllowedHost) {
        // Early cleanup of any non-OneSignal old service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              const activeWorker = registration.active || registration.installing || registration.waiting;
              const scriptUrl = activeWorker ? activeWorker.scriptURL : '';
              // Exclude our unified OneSignal script from cleanup
              if (scriptUrl && !scriptUrl.toLowerCase().includes('onesignal')) {
                console.log('[OneSignal Early Cleanup] Unregistering old Service Worker:', scriptUrl);
                registration.unregister().catch(function(err) {
                  console.warn('[OneSignal Early Cleanup] Error unregistering:', err);
                });
              }
            });
          }).catch(function(err) {
            console.warn('[OneSignal Early Cleanup] Error getting registrations:', err);
          });
        }
      } else {
        console.warn('[OneSignal] Running on non-production origin:', window.location.hostname);
      }
    </script>

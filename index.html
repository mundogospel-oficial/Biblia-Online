    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      const isAllowedHost = 
        window.location.hostname === "online-biblia.vercel.app" || 
        window.location.hostname === "localhost" || 
        window.location.hostname === "127.0.0.1";

      if (isAllowedHost) {
        // Early cleanup of any non-OneSignal old service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              const activeWorker = registration.active || registration.installing || registration.waiting;
              const scriptUrl = activeWorker ? activeWorker.scriptURL : '';
              // Exclude our unified sw.js and OneSignal scripts from cleanup
              if (scriptUrl && !scriptUrl.toLowerCase().includes('onesignal') && !scriptUrl.toLowerCase().endsWith('sw.js')) {
                console.log('[OneSignal Early Cleanup] Unregistering old Service Worker:', scriptUrl);
                registration.unregister().catch(function(err) {
                  console.warn('[OneSignal Early Cleanup] Error unregistering:', err);
                });
              }
            });
          }).catch(function(err) {
            console.warn('[OneSignal Early Cleanup] Error getting registrations:', err);
          });
        }

        const appId = "%VITE_ONESIGNAL_APP_ID%";
        if (appId && !appId.startsWith("%") && !appId.startsWith("YOUR_")) {
          window.OneSignalDeferred = window.OneSignalDeferred || [];
          OneSignalDeferred.push(async function(OneSignal) {
            if (window.OneSignalInitialized || OneSignal.initialized) {
              console.log('[OneSignal] Already initialized early in index.html');
              window.OneSignalInitialized = true;
              return;
            }
            try {
              console.log('[OneSignal] Initializing SDK early in index.html');
              await OneSignal.init({
                appId: appId,
                allowLocalhostAsSecureOrigin: true,
                serviceWorkerParam: { scope: '/' },
                serviceWorkerPath: 'sw.js'
              });
              window.OneSignalInitialized = true;
              console.log('[OneSignal] SDK initialized early successfully');
            } catch (e) {
              if (e && (e.message?.includes('already initialized') || e.includes?.('already initialized'))) {
                console.log('[OneSignal] Already initialized caught in early init');
                window.OneSignalInitialized = true;
              } else {
                console.warn('[OneSignal] Initialization skipped or failed:', e);
              }
            }
          });
        } else {
          console.warn('[OneSignal] OneSignal App ID not configured or is a placeholder.');
        }
      } else {
        console.warn('[OneSignal] Bypassed initialization on non-production origin:', window.location.hostname);
      }
    </script>
